name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FINANCE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/finance-release.jks"
          test -s "$RUNNER_TEMP/finance-release.jks"

      - name: Run unit tests
        run: bash ./gradlew test

      - name: Build signed debug APK
        env:
          FINANCE_SYNC_URL: ${{ secrets.FINANCE_SYNC_URL }}
          FINANCE_SYNC_TOKEN: ${{ secrets.FINANCE_SYNC_TOKEN }}
          FINANCE_KEYSTORE_PATH: $RUNNER_TEMP/finance-release.jks
          FINANCE_KEY_ALIAS: ${{ secrets.FINANCE_KEY_ALIAS }}
          FINANCE_KEYSTORE_PASSWORD: ${{ secrets.FINANCE_KEYSTORE_PASSWORD }}
          FINANCE_KEY_PASSWORD: ${{ secrets.FINANCE_KEY_PASSWORD }}
        run: bash ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FinanceSMSTracker-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
