name: Oracle finance tests

on:
  push:
    branches:
      - main
    paths:
      - "oracle-finance/**"
      - ".github/workflows/oracle-test.yml"
  pull_request:
    paths:
      - "oracle-finance/**"
      - ".github/workflows/oracle-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracle-finance/api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Oracle finance tests
        run: pytest -q
