name: Android tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - "oracle-finance/**"
      - ".github/workflows/oracle-deploy.yml"
  pull_request:
    paths-ignore:
      - "oracle-finance/**"
      - ".github/workflows/oracle-deploy.yml"
  workflow_dispatch:

# A newer push cancels the older run still in progress on the same branch,
# so only the latest commit gets built and uploaded.
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job: tests, then the signed release APK, then Firebase. The release APK is
  # the one that gets installed, so no separate debug build is made. If the tests
  # fail, the build and the upload never run.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Caches Gradle itself, dependencies and the build cache between runs.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Restore shared signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.FINANCE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/finance-release.jks"
          test -s "$RUNNER_TEMP/finance-release.jks"

      - name: Run unit tests and build signed release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
          FINANCE_SYNC_URL: ${{ secrets.FINANCE_SYNC_URL }}
          FINANCE_SYNC_TOKEN: ${{ secrets.FINANCE_SYNC_TOKEN }}
          FINANCE_KEYSTORE_PATH: ${{ runner.temp }}/finance-release.jks
          FINANCE_KEY_ALIAS: ${{ secrets.FINANCE_KEY_ALIAS }}
          FINANCE_KEYSTORE_PASSWORD: ${{ secrets.FINANCE_KEYSTORE_PASSWORD }}
          FINANCE_KEY_PASSWORD: ${{ secrets.FINANCE_KEY_PASSWORD }}
        run: bash ./gradlew test assembleRelease

      - name: Rename APK
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" FinanceApp.apk

      - name: Keep the APK as a download
        uses: actions/upload-artifact@v4
        with:
          name: FinanceSMSTracker-release-apk
          path: FinanceApp.apk
          if-no-files-found: error
          retention-days: 30

      # Never for pull requests or branches other than main.
      - name: Upload to Firebase App Distribution
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: FinanceApp.apk
