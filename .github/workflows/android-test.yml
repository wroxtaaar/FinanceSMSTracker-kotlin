name: Android tests

on:
  push:
    branches:
      - main
    paths-ignore:
      - "oracle-finance/**"
      - ".github/workflows/oracle-deploy.yml"
  pull_request:
    paths-ignore:
      - "oracle-finance/**"
      - ".github/workflows/oracle-deploy.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Run unit tests
        run: bash ./gradlew test
