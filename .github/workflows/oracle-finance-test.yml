name: Oracle Finance Tests

on:
  push:
    branches: [main, finance-system-integration]
    paths:
      - "oracle-finance/**"
  pull_request:
    paths:
      - "oracle-finance/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: oracle-finance/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q
